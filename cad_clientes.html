<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes - InvenTI</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">
    <!-- Menu Lateral Embutido via Iframe -->
    <iframe src="menu.html" class="h-full w-64 border-none hidden md:block"></iframe>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Cadastro de Cliente</h1>
            <p class="text-sm text-slate-500">Adicione novas empresas parceiras ao ecossistema</p>
        </header>

        <div class="bg-white rounded-xl border border-slate-200 shadow-xs max-w-4xl p-6">
            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Razão Social / Nome</label>
                        <input type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">CNPJ / CPF</label>
                        <input type="text" required placeholder="00.000.000/0000-00" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail de Contato TI</label>
                        <input type="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Telefone</label>
                        <input type="tel" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1">SLA Contratado / Observações</label>
                        <textarea rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm placeholder:text-slate-400" placeholder="Ex: Suporte 24/7 com reposição de hardware em até 4 horas."></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 border-t border-slate-100 pt-4">
                    <a href="tela_principal.html" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition text-sm font-medium">Cancelar</a>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition text-sm font-medium">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
